kind = "web"
previewPath = "/"
title = "FieldReady — Field Training"
description = "Offline-first field training development foundation with fictional DORs, encrypted local drafts, supervisor dashboard, and portable PostgreSQL security schema."
version = "1.0.0"
id = "artifacts/field-training"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18795

[services.development]
run = "pnpm --filter @workspace/field-training run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/field-training", "run", "build" ]
serve = "static"
publicDir = "artifacts/field-training/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18795"
BASE_PATH = "/"
