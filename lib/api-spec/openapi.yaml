openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: secure-records
    description: Secure records operations
  - name: audit-logs
    description: Development-only audit log samples
  - name: dispatch
    description: Protected dispatch event prefill
  - name: resources
    description: Clerk-authenticated reference document catalog and downloads
  - name: patrol-view
    description: Signed-in link to Division Patrol View
  - name: training-packets
    description: Agency-roster-authorized training packet sync and reads
  - name: account
    description: Verified account operational profile
  - name: packet-review
    description: Server-scoped Coordinator packet review and PO acknowledgment
  - name: assignment-transitions
    description: Coordinator-authorized successor assignment transitions
  - name: training-alerts
    description: NRT, NRT review request and Phase IV Not release alerts for the assigned Coordinator and FTO Sergeants
paths:
  /v1/account/operational-profile:
    get:
      operationId: getOperationalProfile
      tags: [account]
      summary: Read the verified account's operational profile
      responses:
        "200":
          description: Current operational identity and version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalProfileContext" }
        "401": { description: Sign-in required }
        "403": { description: Verified FTO or PO required }
        "503": { description: Agency storage unavailable }
    put:
      operationId: updateOperationalProfile
      tags: [account]
      summary: Update the verified account's operational profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalProfileInput" }
      responses:
        "200":
          description: Saved operational identity and version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalProfileContext" }
        "400": { description: Invalid token or request }
        "401": { description: Sign-in required }
        "403": { description: Verified FTO or PO required }
        "409": { description: Profile changed; refresh before retry }
        "503": { description: Agency storage unavailable }
  /v1/account/operational-profile/history:
    get:
      operationId: getOperationalProfileHistory
      tags: [account]
      summary: Read the verified account's profile change history
      description: Own-account history only. Identity and actor come from the verified server session. No account selector is accepted.
      parameters:
        - name: beforeVersion
          in: query
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: Profile history page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalProfileHistory" }
        "400": { description: Invalid cursor or unsupported account selector }
        "401": { description: Sign-in required }
        "403": { description: Verified FTO or PO required }
        "503": { description: Agency storage unavailable }
  /v1/account/operational-profile/clear:
    post:
      operationId: clearOperationalProfile
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalProfileClearInput" }
      responses:
        "200":
          description: Versioned empty own-profile state; account, roster and packets unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalProfileContext" }
        "400": { description: Missing confirmation or invalid request }
        "401": { description: Sign-in required }
        "403": { description: Verified FTO or PO required }
        "409": { description: Profile changed; refresh before retry }
        "503": { description: Agency storage unavailable }
  /v1/packet-review/context:
    get:
      operationId: getPacketReviewContext
      tags: [packet-review]
      responses:
        "200":
          description: Verified PO totals-review or Coordinator receipt gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketReviewContext" }
  /v1/packet-review/coordinator:
    put:
      operationId: updatePacketCoordinator
      tags: [packet-review]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PacketCoordinatorInput" }
      responses:
        "200":
          description: Server-confirmed Coordinator assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketCoordinatorAssignment" }
  /v1/packet-review/submissions:
    get:
      operationId: listPacketSubmissions
      tags: [packet-review]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Scoped PO totals-review list, Coordinator inbox, or FTO status list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketSubmissionPage" }
  /v1/packet-review/submissions/{id}:
    get:
      operationId: getPacketSubmission
      tags: [packet-review]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Immutable packet for authorized staff or the PO's own UA details and period summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketSubmissionDetail" }
    post:
      operationId: actOnPacketSubmission
      tags: [packet-review]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PacketReviewActionInput" }
      responses:
        "200":
          description: Server-confirmed PO UA and period review or Coordinator review action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketSubmission" }
  /v1/alerts:
    get:
      operationId: listTrainingAlerts
      tags: [training-alerts]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, closed], default: open } }
      responses:
        "200":
          description: Alerts scoped to the verified Coordinator, every alert for an FTO Sergeant, or the FTO's own alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingAlertPage" }
        "403": { description: "Verified FTO, Coordinator or FTO Sergeant required" }
        "503": { description: Alert storage unavailable }
  /v1/alerts/nrt-review-request:
    post:
      operationId: createNrtReviewRequest
      tags: [training-alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NrtReviewRequestInput" }
      responses:
        "200":
          description: Server-recorded NRT review request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingAlert" }
        "403": { description: Active assignment to the PO required }
        "503": { description: Alert storage unavailable }
  /v1/alerts/week15:
    put:
      operationId: saveWeek15Recommendation
      tags: [training-alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Week15RecommendationInput" }
      responses:
        "200":
          description: Not release alert opened, changed, or not needed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Week15RecommendationResult" }
        "403": { description: Active Phase IV assignment to the PO required }
        "422": { description: Phase IV assignment required }
        "503": { description: Alert storage unavailable }
  /v1/alerts/{id}/close:
    post:
      operationId: closeTrainingAlert
      tags: [training-alerts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseTrainingAlertInput" }
      responses:
        "200":
          description: Alert closed for every recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingAlert" }
        "400": { description: Closing note required }
        "403": { description: Coordinator or FTO Sergeant required }
        "404": { description: Alert not found in scope }
        "409": { description: Alert already closed }
  /v1/agency/assignment-transitions/context:
    get:
      operationId: getAssignmentTransitionContext
      tags: [assignment-transitions]
      responses:
        "200":
          description: Server-authorized assignments, trusted FTO options, and transition history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentTransitionContext" }
        "401": { description: Verified sign-in required }
        "403": { description: Active FTO Coordinator scope required }
        "503": { description: Agency storage unavailable }
  /v1/agency/assignment-transitions/history:
    get:
      operationId: getAssignmentTransitionHistory
      tags: [assignment-transitions]
      parameters:
        - { name: assignmentId, in: query, required: true, schema: { type: string, minLength: 36, maxLength: 36, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: One PO's assignment transition history page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentTransitionHistoryPage" }
        "400": { description: Invalid history page request }
        "403": { description: Active FTO Coordinator scope required }
        "503": { description: Agency storage unavailable }
  /v1/agency/assignment-transitions:
    post:
      operationId: createSuccessorAssignment
      tags: [assignment-transitions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuccessorAssignmentInput" }
      responses:
        "200":
          description: Idempotent retry of a previously completed transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentTransitionEnvelope" }
        "201":
          description: Successor assignment created without changing packet records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentTransitionEnvelope" }
        "400": { description: Invalid transition input }
        "401": { description: Verified sign-in required }
        "403": { description: Coordinator scope or trusted roster assignment required }
        "409": { description: Conflicting dates or operation replay conflict }
        "422": { description: Assignment dates or phase are not valid }
        "503": { description: Agency storage unavailable }
  /v1/staging/training-records:
    get:
      operationId: listStagingTrainingRecords
      summary: List authorized synthetic training records
      description: Development-only isolated staging. Never uploads device drafts or serves operational records.
      responses:
        "200":
          description: Scoped synthetic records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      operationId: createStagingTrainingRecord
      summary: Create a synthetic record within an active FTO assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingTrainingInput" }
      responses:
        "201":
          description: Synthetic record committed with audit event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/training-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getStagingTrainingRecord
      summary: Read one authorized synthetic record
      responses:
        "200":
          description: Scoped synthetic record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    put:
      operationId: updateStagingTrainingRecord
      summary: Version-checked FTO synthetic record update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingTrainingUpdate" }
      responses:
        "200":
          description: Record and audit committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/training-records/{id}/acknowledgement:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acknowledgeStagingTrainingRecord
      summary: PO acknowledges their own submitted synthetic record version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingAcknowledgementInput" }
      responses:
        "200":
          description: Acknowledgement and audit committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/scenario:
    get:
      operationId: getTestAdminScenario
      summary: List fictional classes, participants and assignments (test administrator only)
      responses:
        "200":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/audit:
    get:
      operationId: listTestAdminAuditEvents
      summary: Read-only synthetic audit history (test administrator only)
      responses:
        "200":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminAuditEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/records/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listTestAdminTrainingRecordVersions
      summary: Read fictional training record versions (test administrator only)
      responses:
        "200":
          description: Ordered, read-only synthetic record versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminRecordVersionsEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/participants:
    post:
      operationId: createTestAdminParticipant
      summary: Create a fictional participant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAdminParticipantInput" }
      responses:
        "201":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/participants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateTestAdminParticipant
      summary: Update a fictional participant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAdminParticipantInput" }
      responses:
        "200":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/participants/{id}/deactivation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: deactivateTestAdminParticipant
      summary: Deactivate a fictional participant (audited; never deleted)
      responses:
        "200":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/classes:
    post:
      operationId: createTestAdminClass
      summary: Create a fictional class
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAdminClassInput" }
      responses:
        "201":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/classes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateTestAdminClass
      summary: Update a fictional class
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAdminClassInput" }
      responses:
        "200":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/classes/{id}/deactivation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: deactivateTestAdminClass
      summary: Deactivate a fictional class (audited; never deleted)
      responses:
        "200":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/assignments:
    post:
      operationId: createTestAdminAssignment
      summary: Create a fictional assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAdminAssignmentInput" }
      responses:
        "201":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/assignments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateTestAdminAssignment
      summary: Update a fictional assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAdminAssignmentInput" }
      responses:
        "200":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/test-admin/assignments/{id}/deactivation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: deactivateTestAdminAssignment
      summary: Deactivate a fictional assignment (audited; never deleted)
      responses:
        "200":
          description: Synthetic staging result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestAdminScenarioEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /auth/mock-login:
    post:
      operationId: mockLogin
      tags: [auth]
      summary: Development-only mock login
      description: Returns a non-JWT demonstration token in non-production environments only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockLoginInput"
      responses:
        "200":
          description: Mock login accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockLoginEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/secure-records:
    get:
      operationId: listSecureRecords
      tags: [secure-records]
      summary: List secure records
      description: Returns mock records by default or normalized upstream records when the live integration is enabled. Live requests require a Clerk-authenticated session and a server-side authorization grant; the upstream uses only the server-level REAL_API_KEY.
      responses:
        "200":
          description: Secure records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecureRecordsEnvelope"
        "401":
          description: Sign-in is required for the live integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The upstream service failed or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The live integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The upstream request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/training-packets:
    get:
      operationId: listTrainingPackets
      tags: [training-packets]
      summary: List packets assigned to the signed-in agency identity
      description: The server scopes results by verified agency claims and its own assignment roster. Browser role or assignment data is never used for authorization.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor returned by the previous page.
          schema: { type: string, maxLength: 256 }
        - name: recruit
          in: query
          required: false
          description: Case-insensitive partial match within the authorized roster.
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: date_from
          in: query
          required: false
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: date_to
          in: query
          required: false
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      responses:
        "200":
          description: Authorized packet snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        "401":
          description: Verified agency sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: No matching agency assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Agency records service is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/sync-readiness:
    get:
      operationId: getTrainingPacketSyncReadiness
      tags: [training-packets]
      summary: Check whether automatic packet sync is allowed
      description: Automatic sync is enabled only for a verified FTO on an agency-configured network address. Manual sync still enforces signed role and server roster checks.
      responses:
        "200":
          description: Sync readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketSyncReadinessEnvelope" }
        default:
          description: Authentication or service configuration error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/sync:
    post:
      operationId: syncTrainingPackets
      tags: [training-packets]
      summary: Save editable packet drafts as the assigned FTO
      description: Synchronization never submits a packet. Drafts are visible only to their assigned FTO and remain editable until the separate explicit finalization operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketSyncInput" }
      responses:
        "200":
          description: All packets committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketSyncEnvelope" }
        "400":
          description: Invalid packet payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Verified FTO sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: FTO identity and badge do not match the server roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: A packet version conflicts with the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Agency records service is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}/release:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" } }
    post:
      operationId: releaseTrainingPacket
      tags: [training-packets]
      summary: Release an explicitly reviewed committed snapshot as a class coordinator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketReviewInput" }
      responses:
        "200":
          description: Server-owned packet workflow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        default:
          description: Authentication, scope, conflict, validation or storage error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}/acknowledge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" } }
    post:
      operationId: acknowledgeTrainingPacket
      tags: [training-packets]
      summary: Record assigned PO review of the exact released snapshot, not an electronic signature
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketAcknowledgmentInput" }
      responses:
        "200":
          description: Server-owned packet workflow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        default:
          description: Authentication, scope, conflict, validation or storage error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}/withdraw:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" } }
    post:
      operationId: withdrawTrainingPacket
      tags: [training-packets]
      summary: Permanently withdraw a packet for correction without erasing its history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketWithdrawalInput" }
      responses:
        "200":
          description: Server-owned packet workflow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        default:
          description: Authentication, scope, conflict, validation or storage error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}/finalize:
    post:
      operationId: finalizeTrainingPacket
      tags: [training-packets]
      summary: Explicitly finalize a saved draft for its assigned Coordinator
      description: Rechecks the active server roster, exact draft version, and content hash. Finalization sends the snapshot to the assigned PO for totals review; the Coordinator can see it only after that review.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketFinalizationInput" }
      responses:
        "200":
          description: Finalized packet receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketFinalizationReceipt" }
        default:
          description: Identity, assignment, validation, or version failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" }
    get:
      operationId: getTrainingPacket
      tags: [training-packets]
      summary: Read one packet within the caller's agency assignment scope
      responses:
        "200":
          description: Authorized packet snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        "401":
          description: Verified agency sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: No matching agency assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Packet not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Agency records service is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: List development audit log samples
      description: Returns deterministic, pseudonymized sample audit events in development only.
      responses:
        "200":
          description: Development audit log samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsEnvelope"
        "404":
          description: This endpoint is disabled in production environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/dispatch/incident-lookup:
    post:
      operationId: dispatchIncidentLookup
      tags: [dispatch]
      summary: Look up an incident explicitly entered by the FTO
      description: Returns allowlisted shared incident metrics only after the entered incident and assigned unit match. Unit-specific times are retained; officer details are excluded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchIncidentLookupInput"
      responses:
        "200":
          description: Editable incident and unit candidates for FTO review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchIncidentEnvelope"
        default:
          description: Invalid input, unauthorized access, or unavailable approved adapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/dispatch/event-ingress:
    post:
      operationId: dispatchEventIngress
      tags: [dispatch]
      summary: Look up an approved dispatch event
      description: Looks up one explicit event ID using the protected server-side adapter. This does not discover or poll active units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchEventIngressInput"
      responses:
        "200":
          description: Normalized editable run-detail prefill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchEventIngressEnvelope"
        "400":
          description: Invalid event identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Dispatch access is not authorized for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected dispatch lookup failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The approved dispatch adapter failed or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Dispatch access or adapter configuration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The approved dispatch adapter timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/patrol-view/status:
    get:
      operationId: getPatrolViewStatus
      tags: [patrol-view]
      summary: Patrol View link availability
      description: Reports whether the Division Patrol View link is configured for this deployment. The address itself is not returned.
      responses:
        "200":
          description: Link availability
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    type: object
                    required: [enabled]
                    properties:
                      enabled:
                        type: boolean
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/patrol-view/open:
    get:
      operationId: openPatrolView
      tags: [patrol-view]
      summary: Open Division Patrol View
      description: Redirects a signed-in user to the Division Patrol View address held in private server settings.
      responses:
        "302":
          description: Redirect to Division Patrol View
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Patrol View is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List reference documents
      description: Returns the resource documents available to signed-in users. Every item maps to a server-side allowlisted file.
      responses:
        "200":
          description: Available reference documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCatalogEnvelope"
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/resources/{resourceId}/download:
    get:
      operationId: downloadResourceFile
      tags: [resources]
      summary: Download a reference document
      description: Streams an allowlisted file as an attachment after Clerk session authentication. Files are not exposed through public static URLs.
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            enum:
              - amys-law-factors
              - bmv-2255-urine-0-bac
              - bmv2255-example
              - domestic-violence-protocol
              - drug-possession-weights
              - dv-3-3-domestic-violence
              - dv-cpo-vs-tpo
              - dv-family-household-member-relationships
              - dv-feti-model
              - i-40-115-domestic-violence-lethality-screen
              - dv-power-and-control-wheel
              - dv-safety-plan-victims-page-1
              - dv-safety-plan-victims-page-2
              - dv-strangulation-assessment-card-v4
              - dv-strangulation-checklist
              - dv-strangulation-physiological-consequences
              - dv-types-of-abuse-worksheet-1
              - dv-strangulation-diagram
              - key-criminal-law-issues-2024
              - ohio-constitutional-opinions
              - ohio-supreme-court-felony-quick-reference
              - police-phone-directory
              - prior-offenses-constituting-wud
              - columbus-criminal-complaint-manual
              - columbus-street-card-2026-08
              - columbus-street-card-2026-08-spanish
              - felony-traffic-processing-guidelines-2023
              - felony-packet-order
              - substation-addresses
              - fto-unit-contact-information
              - verizon-search-warrant-example
              - cell-phone-nexus-sheet
              - mobile-device-collection-guidelines
      responses:
        "200":
          description: The requested document, delivered as an attachment or, for the complaint manual, inline
          headers:
            Content-Disposition:
              description: Safe attachment or inline filename
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The resource identifier is not in the allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The allowlisted resource file is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/phase-extension-requests:
    get:
      operationId: listPhaseExtensionRequests
      tags: [phase-extensions]
      summary: List phase extension requests available to the signed-in staff member
      description: FTOs receive their own request statuses; FTO Coordinators receive pending requests and denials with explanations within their current assignment scope. The server verifies the Clerk session and role metadata.
      responses:
        "200":
          description: Authorized phase extension requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhaseExtensionRequestsEnvelope" }
        default:
          description: Authentication, role, or storage service error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      operationId: submitPhaseExtensionRequest
      tags: [phase-extensions]
      summary: Submit a phase extension request as an FTO
      description: The authenticated FTO identity and request timestamp are assigned by the server. Role preview values are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhaseExtensionRequestInput" }
      responses:
        "201":
          description: Request stored for Coordinator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhaseExtensionRequestsEnvelope" }
        default:
          description: Authentication, role, validation, or storage service error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/phase-extension-requests/{id}/review:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._:-]+$" }
    post:
      operationId: reviewPhaseExtensionRequest
      tags: [phase-extensions]
      summary: Approve or deny a pending request as an FTO Coordinator
      description: The server verifies the signed-in Coordinator role and records the decision without trusting client role preview. A denial may include a short explanation; approval does not accept one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhaseExtensionReviewInput" }
      responses:
        "200":
          description: Request decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhaseExtensionRequestsEnvelope" }
        default:
          description: Authentication, role, conflict, or storage service error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
components:
  schemas:
    OperationalIdentity:
      type: object
      additionalProperties: false
      required: [assignmentToken, cadUnit, company]
      properties:
        assignmentToken: { type: string, pattern: "^[0-9]{4}[A-Z](-[12])?$" }
        cruiserNumber:
          type: string
          deprecated: true
          description: Legacy snapshot only; not a physical fleet number.
          pattern: "^[0-9]{4}$"
        districtToken: { type: string, pattern: "^[0-9]{4}$" }
        cadUnit: { type: string, pattern: "^[0-9]{4}[A-Z](-[12])?$", description: "Live profiles omit the division-internal side; former full-unit values remain readable in frozen packet snapshots." }
        company: { type: string, pattern: "^[A-Z]$" }
        side: { type: string, enum: ["1", "2"] }
    OperationalProfileHistoryEntry:
      type: object
      additionalProperties: false
      required: [version, oldToken, newToken, recordedAt, actor, event]
      properties:
        version: { type: integer, minimum: 1 }
        oldToken: { type: ["string", "null"] }
        newToken: { type: ["string", "null"] }
        recordedAt: { type: string, format: date-time }
        actor: { type: string, enum: [self, agency_migration] }
        event: { type: string, enum: [created, changed, baseline, cleared] }
    OperationalProfileHistory:
      type: object
      additionalProperties: false
      required: [subject, entries, nextBeforeVersion]
      properties:
        subject: { type: string }
        entries:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/OperationalProfileHistoryEntry" }
        nextBeforeVersion: { type: ["integer", "null"], minimum: 1 }
    OperationalProfileClearInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, confirmedNoVehicle]
      properties:
        expectedVersion: { type: integer, minimum: 0, maximum: 2147483646 }
        confirmedNoVehicle: { type: boolean, enum: [true] }
    OperationalProfileInput:
      type: object
      additionalProperties: false
      required: [assignmentToken, expectedVersion]
      properties:
        assignmentToken: { type: string, pattern: "^[0-9]{4}[A-Z](-[12])?$" }
        expectedVersion: { type: integer, minimum: 0, maximum: 2147483646 }
    OperationalProfileContext:
      type: object
      additionalProperties: false
      required: [subject, role, badge, version, identity]
      properties:
        subject: { type: string }
        role: { type: string, enum: [FTO, PO] }
        badge: { type: string }
        version: { type: integer, minimum: 0 }
        identity:
          oneOf:
            - { $ref: "#/components/schemas/OperationalIdentity" }
            - { type: "null" }
        updatedAt: { type: string, format: date-time }
    PacketCoordinator:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    PacketCoordinatorAssignment:
      type: object
      required: [po_id, po_badge, coordinator_id, revision]
      properties:
        po_id: { type: string }
        po_badge: { type: string }
        coordinator_id: { type: string }
        revision: { type: integer, minimum: 1 }
    PacketCoordinatorInput:
      type: object
      additionalProperties: false
      required: [po_id, coordinator_id, expected_revision]
      properties:
        po_id: { type: string, minLength: 1, maxLength: 256 }
        coordinator_id: { type: string, minLength: 1, maxLength: 256 }
        expected_revision: { type: integer, minimum: 0 }
    PacketHandoffStatus:
      type: string
      enum: [draft, awaiting_po_totals_review, awaiting_coordinator_receipt, coordinator_review, correction_requested, awaiting_po_release, awaiting_po_acknowledgment, po_acknowledged, withdrawn]
    PacketReviewContext:
      type: object
      required: [available, account_id, role, coordinators, assignments, pending_count, pending]
      properties:
        available: { type: boolean }
        account_id: { type: string }
        role: { type: string, enum: [PO, FTO, FTO_SGT, FTO_COORDINATOR, FTO_COC, POLICENET, POLICENET_ADMIN_SGT] }
        coordinators:
          type: array
          items: { $ref: "#/components/schemas/PacketCoordinator" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/PacketCoordinatorAssignment" }
        pending_count: { type: integer, minimum: 0 }
        pending:
          anyOf:
            - { $ref: "#/components/schemas/PacketSubmission" }
            - { type: "null" }
    PacketSubmission:
      type: object
      required: [id, packet_id, packet_version, coordinator_id, coordinator_name, state, handoff_status, record_date, po_name, fto_name, can_correct, submitted_at, po_reviewed_at, acknowledged_at, reviewed_at, review_note, released_at, po_acknowledged_at]
      properties:
        id: { type: string, format: uuid }
        packet_id: { type: string }
        packet_version: { type: integer, minimum: 1 }
        coordinator_id: { type: string }
        coordinator_name: { type: string }
        state: { type: string, enum: [submitted, acknowledged, approved, correction_requested, withdrawn] }
        handoff_status: { $ref: "#/components/schemas/PacketHandoffStatus" }
        record_date: { type: string }
        po_name: { type: string }
        fto_name: { type: string }
        can_correct: { type: boolean }
        submitted_at: { type: string }
        po_reviewed_at: { type: ["string", "null"] }
        acknowledged_at: { type: ["string", "null"] }
        reviewed_at: { type: ["string", "null"] }
        review_note: { type: string }
        released_at: { type: ["string", "null"] }
        po_acknowledged_at: { type: ["string", "null"] }
    PacketSubmissionPage:
      type: object
      required: [items, has_more, next_offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PacketSubmission" }
        has_more: { type: boolean }
        next_offset: { type: integer, minimum: 0 }
    PacketSubmissionHistory:
      type: object
      required: [action, occurred_at, note]
      properties:
        action: { type: string }
        occurred_at: { type: string }
        note: { type: string }
    PacketSubmissionDetail:
      type: object
      required: [submission, report, po_totals, history]
      properties:
        submission: { $ref: "#/components/schemas/PacketSubmission" }
        report:
          oneOf:
            - { $ref: "#/components/schemas/TrainingPacketReport" }
            - { type: "null" }
        po_totals:
          oneOf:
            - { $ref: "#/components/schemas/PacketPoTotals" }
            - { type: "null" }
        history:
          type: array
          items: { $ref: "#/components/schemas/PacketSubmissionHistory" }
    PacketPoPeriodTotals:
      type: object
      additionalProperties: false
      required: [start_date, end_date, log_count, reviewed_log_count, activity, rating_counts, reviewed_run_checklists, total_runs]
      properties:
        start_date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        end_date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        log_count: { type: integer, minimum: 0 }
        reviewed_log_count: { type: integer, minimum: 0 }
        activity:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        rating_counts:
          type: object
          additionalProperties: false
          required: [NO, A, RT, UA, NRT]
          properties:
            NO: { type: integer, minimum: 0 }
            A: { type: integer, minimum: 0 }
            RT: { type: integer, minimum: 0 }
            UA: { type: integer, minimum: 0 }
            NRT: { type: integer, minimum: 0 }
        reviewed_run_checklists: { type: integer, minimum: 0 }
        total_runs: { type: integer, minimum: 0 }
    PacketPoTotals:
      type: object
      additionalProperties: false
      required: [daily, weekly, monthly, unacceptable_details]
      properties:
        daily: { $ref: "#/components/schemas/PacketPoPeriodTotals" }
        weekly: { $ref: "#/components/schemas/PacketPoPeriodTotals" }
        monthly: { $ref: "#/components/schemas/PacketPoPeriodTotals" }
        unacceptable_details:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PacketPoUaDetail" }
    PacketPoUaDetail:
      type: object
      additionalProperties: false
      required: [record_date, category_key, rating, justification, limbo_day]
      properties:
        record_date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        category_key: { type: string, minLength: 1, maxLength: 80, pattern: "^[A-Za-z][A-Za-z0-9]*$" }
        rating: { type: string, enum: [UA] }
        justification: { type: string, maxLength: 100000 }
        limbo_day:
          type: boolean
          description: Documented on a Limbo Day; listed for the PO but not counted against them.
    TrainingAlert:
      type: object
      required: [id, kind, po_name, po_badge, class_name, phase, fto_name, coordinator_id, category, record_date, report_ids, summary, week15_choice, week15_changed_at, created_at, state, closed_by_name, closed_by_role, closed_at, close_note]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [NRT, NRT_REVIEW_REQUEST, NOT_RELEASE] }
        po_name: { type: string }
        po_badge: { type: string }
        class_name: { type: string }
        phase: { type: integer, minimum: 1, maximum: 4 }
        fto_name: { type: string }
        coordinator_id: { type: string }
        category: { anyOf: [{ type: string }, { type: "null" }] }
        record_date: { anyOf: [{ type: string }, { type: "null" }] }
        report_ids: { type: array, items: { type: string } }
        summary: { type: string }
        week15_choice: { anyOf: [{ type: string, enum: [release, not_release] }, { type: "null" }] }
        week15_changed_at: { anyOf: [{ type: string }, { type: "null" }] }
        created_at: { type: string }
        state: { type: string, enum: [open, closed] }
