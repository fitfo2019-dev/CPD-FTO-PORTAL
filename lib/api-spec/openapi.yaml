openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: secure-records
    description: Secure records operations
  - name: audit-logs
    description: Development-only audit log samples
  - name: dispatch
    description: Protected dispatch event prefill
  - name: resources
    description: Clerk-authenticated reference document catalog and downloads
  - name: training-packets
    description: Agency-roster-authorized training packet sync and reads
paths:
  /v1/packet-review/context:
    get:
      operationId: getPacketReviewContext
      tags: [packet-review]
      responses:
        "200":
          description: Verified account context and mandatory receipt gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketReviewContext" }
  /v1/packet-review/coordinator:
    put:
      operationId: updatePacketCoordinator
      tags: [packet-review]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PacketCoordinatorInput" }
      responses:
        "200":
          description: Server-confirmed Coordinator assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketCoordinatorAssignment" }
  /v1/packet-review/submissions:
    get:
      operationId: listPacketSubmissions
      tags: [packet-review]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Scoped, paginated submission inbox and FTO status list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketSubmissionPage" }
  /v1/packet-review/submissions/{id}:
    get:
      operationId: getPacketSubmission
      tags: [packet-review]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Immutable submitted packet and its review history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketSubmissionDetail" }
    post:
      operationId: actOnPacketSubmission
      tags: [packet-review]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PacketReviewActionInput" }
      responses:
        "200":
          description: Server-confirmed review action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketSubmission" }
  /v1/staging/training-records:
    get:
      operationId: listStagingTrainingRecords
      summary: List authorized synthetic training records
      description: Development-only isolated staging. Never uploads device drafts or serves operational records.
      responses:
        "200":
          description: Scoped synthetic records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      operationId: createStagingTrainingRecord
      summary: Create a synthetic record within an active FTO assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingTrainingInput" }
      responses:
        "201":
          description: Synthetic record committed with audit event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/training-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getStagingTrainingRecord
      summary: Read one authorized synthetic record
      responses:
        "200":
          description: Scoped synthetic record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    put:
      operationId: updateStagingTrainingRecord
      summary: Version-checked FTO synthetic record update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingTrainingUpdate" }
      responses:
        "200":
          description: Record and audit committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/training-records/{id}/acknowledgement:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acknowledgeStagingTrainingRecord
      summary: PO acknowledges their own submitted synthetic record version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingAcknowledgementInput" }
      responses:
        "200":
          description: Acknowledgement and audit committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /auth/mock-login:
    post:
      operationId: mockLogin
      tags: [auth]
      summary: Development-only mock login
      description: Returns a non-JWT demonstration token in non-production environments only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockLoginInput"
      responses:
        "200":
          description: Mock login accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockLoginEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/secure-records:
    get:
      operationId: listSecureRecords
      tags: [secure-records]
      summary: List secure records
      description: Returns mock records by default or normalized upstream records when the live integration is enabled. Live requests require a Clerk-authenticated session and a server-side authorization grant; the upstream uses only the server-level REAL_API_KEY.
      responses:
        "200":
          description: Secure records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecureRecordsEnvelope"
        "401":
          description: Sign-in is required for the live integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The upstream service failed or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The live integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The upstream request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/training-packets:
    get:
      operationId: listTrainingPackets
      tags: [training-packets]
      summary: List packets assigned to the signed-in agency identity
      description: The server scopes results by verified agency claims and its own assignment roster. Browser role or assignment data is never used for authorization.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor returned by the previous page.
          schema: { type: string, maxLength: 256 }
        - name: recruit
          in: query
          required: false
          description: Case-insensitive partial match for a recruit name or badge, within the signed-in identity's authorized roster.
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: date_from
          in: query
          required: false
          description: Include packets on or after this calendar date.
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: date_to
          in: query
          required: false
          description: Include packets on or before this calendar date.
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      responses:
        "200":
          description: Authorized packet snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        "401":
          description: Verified agency sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: No matching agency assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Agency records service is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/sync-readiness:
    get:
      operationId: getTrainingPacketSyncReadiness
      tags: [training-packets]
      summary: Check whether automatic packet sync is allowed
      description: Automatic sync is enabled only for a verified FTO on an agency-configured network address. Manual sync still enforces signed role and server roster checks.
      responses:
        "200":
          description: Sync readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketSyncReadinessEnvelope" }
        default:
          description: Authentication or service configuration error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/sync:
    post:
      operationId: syncTrainingPackets
      tags: [training-packets]
      summary: Save editable packet drafts as the assigned FTO
      description: Synchronization never submits a packet. Drafts are visible only to their assigned FTO and remain editable until the separate explicit finalization operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketSyncInput" }
      responses:
        "200":
          description: All packets committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketSyncEnvelope" }
        "400":
          description: Invalid packet payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Verified FTO sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: FTO identity and badge do not match the server roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: A packet version conflicts with the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Agency records service is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}/release:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" } }
    post:
      operationId: releaseTrainingPacket
      tags: [training-packets]
      summary: Release an explicitly reviewed committed snapshot as a class coordinator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketReviewInput" }
      responses:
        "200":
          description: Server-owned packet workflow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        default:
          description: Authentication, scope, conflict, validation or storage error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}/acknowledge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" } }
    post:
      operationId: acknowledgeTrainingPacket
      tags: [training-packets]
      summary: Record assigned PO review of the exact released snapshot, not an electronic signature
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketAcknowledgmentInput" }
      responses:
        "200":
          description: Server-owned packet workflow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        default:
          description: Authentication, scope, conflict, validation or storage error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}/withdraw:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" } }
    post:
      operationId: withdrawTrainingPacket
      tags: [training-packets]
      summary: Permanently withdraw a packet for correction without erasing its history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketWithdrawalInput" }
      responses:
        "200":
          description: Server-owned packet workflow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        default:
          description: Authentication, scope, conflict, validation or storage error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}/finalize:
    post:
      operationId: finalizeTrainingPacket
      tags: [training-packets]
      summary: Explicitly finalize a saved draft for its assigned Coordinator
      description: Rechecks the active server roster and draft version. Only this operation makes a packet visible to its assigned Coordinator and PO.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPacketFinalizationInput" }
      responses:
        "200":
          description: Finalized packet receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketSyncRecord" }
        default:
          description: Identity, assignment, validation, or version failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/training-packets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" }
    get:
      operationId: getTrainingPacket
      tags: [training-packets]
      summary: Read one packet within the caller's agency assignment scope
      responses:
        "200":
          description: Authorized packet snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPacketsEnvelope" }
        "401":
          description: Verified agency sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: No matching agency assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Packet not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Agency records service is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: List development audit log samples
      description: Returns deterministic, pseudonymized sample audit events in development only.
      responses:
        "200":
          description: Development audit log samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsEnvelope"
        "404":
          description: This endpoint is disabled in production environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/dispatch/incident-lookup:
    post:
      operationId: dispatchIncidentLookup
      tags: [dispatch]
      summary: Look up an incident explicitly entered by the FTO
      description: Returns allowlisted shared incident metrics only after the entered incident and assigned unit match. Unit-specific times are retained; officer details are excluded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchIncidentLookupInput"
      responses:
        "200":
          description: Editable incident and unit candidates for FTO review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchIncidentEnvelope"
        default:
          description: Invalid input, unauthorized access, or unavailable approved adapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/dispatch/event-ingress:
    post:
      operationId: dispatchEventIngress
      tags: [dispatch]
      summary: Look up an approved dispatch event
      description: Looks up one explicit event ID using the protected server-side adapter. This does not discover or poll active units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchEventIngressInput"
      responses:
        "200":
          description: Normalized editable run-detail prefill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchEventIngressEnvelope"
        "400":
          description: Invalid event identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Dispatch access is not authorized for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected dispatch lookup failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The approved dispatch adapter failed or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Dispatch access or adapter configuration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The approved dispatch adapter timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List reference documents
      description: Returns the resource documents available to signed-in users. Every item maps to a server-side allowlisted file.
      responses:
        "200":
          description: Available reference documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCatalogEnvelope"
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/resources/{resourceId}/download:
    get:
      operationId: downloadResourceFile
      tags: [resources]
      summary: Download a reference document
      description: Streams an allowlisted file as an attachment after Clerk session authentication. Files are not exposed through public static URLs.
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            enum:
              - amys-law-factors
              - bmv-2255-urine-0-bac
              - bmv2255-example
              - domestic-violence-protocol
              - drug-possession-weights
              - dv-3-3-domestic-violence
              - dv-cpo-vs-tpo
              - dv-family-household-member-relationships
              - dv-feti-model
              - i-40-115-domestic-violence-lethality-screen
              - dv-power-and-control-wheel
              - dv-safety-plan-victims-page-1
              - dv-safety-plan-victims-page-2
              - dv-strangulation-assessment-card-v4
              - dv-strangulation-checklist
              - dv-strangulation-physiological-consequences
              - dv-types-of-abuse-worksheet-1
              - dv-strangulation-diagram
              - key-criminal-law-issues-2024
              - ohio-constitutional-opinions
              - ohio-supreme-court-felony-quick-reference
              - police-phone-directory
              - prior-offenses-constituting-wud
      responses:
        "200":
          description: The requested document, delivered as an attachment
          headers:
            Content-Disposition:
              description: Safe attachment filename
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The resource identifier is not in the allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The allowlisted resource file is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/phase-extension-requests:
    get:
      operationId: listPhaseExtensionRequests
      tags: [phase-extensions]
      summary: List phase extension requests available to the signed-in staff member
      description: FTOs receive their own request statuses; FTO Coordinators receive pending requests. The server verifies the Clerk session and role metadata.
      responses:
        "200":
          description: Authorized phase extension requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhaseExtensionRequestsEnvelope" }
        default:
          description: Authentication, role, or storage service error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      operationId: submitPhaseExtensionRequest
      tags: [phase-extensions]
      summary: Submit a phase extension request as an FTO
      description: The authenticated FTO identity and request timestamp are assigned by the server. Role preview values are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhaseExtensionRequestInput" }
      responses:
        "201":
          description: Request stored for Coordinator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhaseExtensionRequestsEnvelope" }
        default:
          description: Authentication, role, validation, or storage service error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/phase-extension-requests/{id}/review:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._:-]+$" }
    post:
      operationId: reviewPhaseExtensionRequest
      tags: [phase-extensions]
      summary: Approve or deny a pending request as an FTO Coordinator
      description: The server verifies the signed-in Coordinator role and records the decision without trusting client role preview.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhaseExtensionReviewInput" }
      responses:
        "200":
          description: Request decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhaseExtensionRequestsEnvelope" }
        default:
          description: Authentication, role, conflict, or storage service error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
components:
  schemas:
    PacketCoordinator:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    PacketCoordinatorAssignment:
      type: object
      required: [po_id, po_badge, coordinator_id, revision]
      properties:
        po_id: { type: string }
        po_badge: { type: string }
        coordinator_id: { type: string }
        revision: { type: integer, minimum: 1 }
    PacketCoordinatorInput:
      type: object
      additionalProperties: false
      required: [po_id, coordinator_id, expected_revision]
      properties:
        po_id: { type: string, minLength: 1, maxLength: 256 }
        coordinator_id: { type: string, minLength: 1, maxLength: 256 }
        expected_revision: { type: integer, minimum: 0 }
    PacketReviewContext:
      type: object
      required: [available, account_id, role, coordinators, assignments, pending_count, pending]
      properties:
        available: { type: boolean }
        account_id: { type: string }
        role: { type: string, enum: [PO, FTO, FTO_COORDINATOR] }
        coordinators:
          type: array
          items: { $ref: "#/components/schemas/PacketCoordinator" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/PacketCoordinatorAssignment" }
        pending_count: { type: integer, minimum: 0 }
        pending:
          anyOf:
            - { $ref: "#/components/schemas/PacketSubmission" }
            - { type: "null" }
    PacketSubmission:
      type: object
