openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: secure-records
    description: Secure records operations
  - name: audit-logs
    description: Development-only audit log samples
  - name: dispatch
    description: Protected dispatch event prefill
  - name: resources
    description: Clerk-authenticated reference document catalog and downloads
paths:
  /v1/staging/training-records:
    get:
      operationId: listStagingTrainingRecords
      summary: List authorized synthetic training records
      description: Development-only isolated staging. Never uploads device drafts or serves operational records.
      responses:
        "200":
          description: Scoped synthetic records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      operationId: createStagingTrainingRecord
      summary: Create a synthetic record within an active FTO assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingTrainingInput" }
      responses:
        "201":
          description: Synthetic record committed with audit event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/training-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getStagingTrainingRecord
      summary: Read one authorized synthetic record
      responses:
        "200":
          description: Scoped synthetic record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    put:
      operationId: updateStagingTrainingRecord
      summary: Version-checked FTO synthetic record update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingTrainingUpdate" }
      responses:
        "200":
          description: Record and audit committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /v1/staging/training-records/{id}/acknowledgement:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acknowledgeStagingTrainingRecord
      summary: PO acknowledges their own submitted synthetic record version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagingAcknowledgementInput" }
      responses:
        "200":
          description: Acknowledgement and audit committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagingTrainingEnvelope" }
        default:
          description: Fail-closed error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /auth/mock-login:
    post:
      operationId: mockLogin
      tags: [auth]
      summary: Development-only mock login
      description: Returns a non-JWT demonstration token in non-production environments only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockLoginInput"
      responses:
        "200":
          description: Mock login accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockLoginEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/secure-records:
    get:
      operationId: listSecureRecords
      tags: [secure-records]
      summary: List secure records
      description: Returns mock records by default or normalized upstream records when the live integration is enabled. Live requests require a Clerk-authenticated session and a server-side authorization grant; the upstream uses only the server-level REAL_API_KEY.
      responses:
        "200":
          description: Secure records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecureRecordsEnvelope"
        "401":
          description: Sign-in is required for the live integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The upstream service failed or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The live integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The upstream request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: List development audit log samples
      description: Returns deterministic, pseudonymized sample audit events in development only.
      responses:
        "200":
          description: Development audit log samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsEnvelope"
        "404":
          description: This endpoint is disabled in production environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/dispatch/event-ingress:
    post:
      operationId: dispatchEventIngress
      tags: [dispatch]
      summary: Look up an approved dispatch event
      description: Looks up one explicit event ID using the protected server-side adapter. This does not discover or poll active units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchEventIngressInput"
      responses:
        "200":
          description: Normalized editable run-detail prefill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchEventIngressEnvelope"
        "400":
          description: Invalid event identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Dispatch access is not authorized for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected dispatch lookup failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The approved dispatch adapter failed or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Dispatch access or adapter configuration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The approved dispatch adapter timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List reference documents
      description: Returns the resource documents available to signed-in users. Every item maps to a server-side allowlisted file.
      responses:
        "200":
          description: Available reference documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCatalogEnvelope"
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/resources/{resourceId}/download:
    get:
      operationId: downloadResourceFile
      tags: [resources]
      summary: Download a reference document
      description: Streams an allowlisted file as an attachment after Clerk session authentication. Files are not exposed through public static URLs.
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            enum:
              - amys-law-factors
              - bmv-2255-urine-0-bac
              - bmv2255-example
              - domestic-violence-protocol
              - drug-possession-weights
              - dv-3-3-domestic-violence
              - dv-cpo-vs-tpo
              - dv-family-household-member-relationships
              - dv-feti-model
              - i-40-115-domestic-violence-lethality-screen
              - dv-power-and-control-wheel
              - dv-safety-plan-victims-page-1
              - dv-safety-plan-victims-page-2
              - dv-strangulation-assessment-card-v4
              - dv-strangulation-checklist
              - dv-strangulation-physiological-consequences
              - dv-types-of-abuse-worksheet-1
              - dv-strangulation-diagram
              - key-criminal-law-issues-2024
              - ohio-constitutional-opinions
              - ohio-supreme-court-felony-quick-reference
              - police-phone-directory
              - prior-offenses-constituting-wud
      responses:
        "200":
          description: The requested document, delivered as an attachment
          headers:
            Content-Disposition:
              description: Safe attachment filename
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The resource identifier is not in the allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The allowlisted resource file is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    StagingTrainingInput:
      type: object
      additionalProperties: false
      required: [operation_id, assignment_id, record_date, narrative, status, synthetic]
      properties:
        operation_id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        record_date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        narrative: { type: string, maxLength: 4000 }
        status: { type: string, enum: [draft, submitted] }
        synthetic: { type: boolean, enum: [true] }
    StagingTrainingUpdate:
      type: object
      additionalProperties: false
      required: [operation_id, base_version, narrative, status, synthetic]
      properties:
        operation_id: { type: string, format: uuid }
        base_version: { type: integer, minimum: 1 }
        narrative: { type: string, maxLength: 4000 }
        status: { type: string, enum: [draft, submitted] }
        synthetic: { type: boolean, enum: [true] }
    StagingAcknowledgementInput:
      type: object
      additionalProperties: false
      required: [operation_id, base_version, acknowledged]
      properties:
        operation_id: { type: string, format: uuid }
        base_version: { type: integer, minimum: 1 }
        acknowledged: { type: boolean, enum: [true] }
    StagingTrainingRecord:
      type: object
      additionalProperties: false
      required: [id, assignment_id, record_date, phase, narrative, status, version, acknowledged_version, synthetic]
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        record_date: { type: string }
        phase: { type: integer, minimum: 1, maximum: 4 }
        narrative: { type: string, maxLength: 4000 }
        status: { type: string, enum: [draft, submitted] }
        version: { type: integer, minimum: 1 }
        acknowledged_version: { type: [integer, "null"], minimum: 1 }
        synthetic: { type: boolean, enum: [true] }
    StagingTrainingEnvelope:
      type: object
      additionalProperties: false
      required: [status, metadata, data]
      properties:
        status: { type: string, enum: [success] }
        metadata:
          type: object
          additionalProperties: false
          required: [total_records, environment]
          properties:
            total_records: { type: integer, minimum: 0, maximum: 100 }
            environment: { type: string, enum: [SYNTHETIC_STAGING] }
        data:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/StagingTrainingRecord" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    HealthEnvelope:
      type: object
      required: [status, metadata, data]
      properties:
        status: { type: string, enum: [success] }
        metadata: { type: object, additionalProperties: true }
        data:
          type: array
          maxItems: 1
          items: { $ref: "#/components/schemas/HealthStatus" }
    MockLoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 256 }
    MockLoginEnvelope:
      type: object
      required: [status, metadata, data]
      properties:
        status: { type: string, enum: [success] }
        metadata: { type: object, additionalProperties: true }
        data:
          type: array
          maxItems: 1
          items:
            type: object
            required: [token]
            properties:
              token: { type: string }
    SecureRecord:
      type: object
      additionalProperties: false
      required: [id, status, updated_at]
      properties:
        id:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$",
          }
        status: { type: string, minLength: 1, maxLength: 64 }
        updated_at: { type: string, format: date }
    SecureRecordsMetadata:
      type: object
      additionalProperties: false
      required: [total_records]
      properties:
        total_records: { type: integer, minimum: 0 }
    SecureRecordsEnvelope:
      type: object
      additionalProperties: false
      required: [status, metadata, data]
      properties:
        status: { type: string, enum: [success] }
        metadata: { $ref: "#/components/schemas/SecureRecordsMetadata" }
        data:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/SecureRecord" }
    AuditLogActor:
      type: object
      additionalProperties: false
      required: [user_id_hash, assigned_role]
      properties:
        user_id_hash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[a-f0-9]{64}$"
        assigned_role:
          type: string
          enum: [RECRUIT, FTO, SERGEANT, ADMIN]
    AuditLogActorValue:
      oneOf:
        - type: string
          enum: [ANONYMOUS, UNAUTHENTICATED]
        - $ref: "#/components/schemas/AuditLogActor"
    AuditLogNetwork:
      type: object
      additionalProperties: false
      required: [client_ip_hash, user_agent]
      properties:
        client_ip_hash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[a-f0-9]{64}$"
        user_agent:
          type: string
          maxLength: 80
    AuditLogEvent:
      type: object
      additionalProperties: false
      required:
        - http_method
        - endpoint
        - payload_bytes
        - status_code
        - success
        - disposition
      properties:
        http_method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        endpoint:
          type: string
          minLength: 1
          maxLength: 200
        payload_bytes:
          type: integer
          minimum: 0
        status_code:
          type: integer
          minimum: 100
          maximum: 599
        success:
          type: boolean
        disposition:
          type: string
          enum: [SUCCESS, FAILURE]
        error_message:
          type: string
          maxLength: 200
    AuditLogRecord:
      type: object
      additionalProperties: false
      required: [timestamp, request_id, actor, network, event]
      properties:
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          minLength: 1
          maxLength: 64
        actor:
          $ref: "#/components/schemas/AuditLogActorValue"
        network:
          $ref: "#/components/schemas/AuditLogNetwork"
        event:
          $ref: "#/components/schemas/AuditLogEvent"
    AuditLogsMetadata:
      type: object
      additionalProperties: false
      required: [total_records, environment]
      properties:
        total_records:
          type: integer
          minimum: 0
        environment:
          type: string
          enum: [MOCK_DEVELOPMENT]
    AuditLogsEnvelope:
      type: object
      additionalProperties: false
      required: [status, metadata, data]
      properties:
        status:
          type: string
          enum: [success]
        metadata:
          $ref: "#/components/schemas/AuditLogsMetadata"
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditLogRecord"
    ResourceCatalogItem:
      type: object
      additionalProperties: false
      required: [id, title, file_type, description, handling_note]
      properties:
        id:
          type: string
          enum:
            - amys-law-factors
            - bmv-2255-urine-0-bac
            - bmv2255-example
            - domestic-violence-protocol
            - drug-possession-weights
            - dv-3-3-domestic-violence
            - dv-cpo-vs-tpo
            - dv-family-household-member-relationships
            - dv-feti-model
            - i-40-115-domestic-violence-lethality-screen
            - dv-power-and-control-wheel
            - dv-safety-plan-victims-page-1
            - dv-safety-plan-victims-page-2
            - dv-strangulation-assessment-card-v4
            - dv-strangulation-checklist
            - dv-strangulation-physiological-consequences
            - dv-types-of-abuse-worksheet-1
            - dv-strangulation-diagram
            - key-criminal-law-issues-2024
            - ohio-constitutional-opinions
            - ohio-supreme-court-felony-quick-reference
            - police-phone-directory
            - prior-offenses-constituting-wud
        title:
          type: string
          minLength: 1
          maxLength: 120
        file_type:
          type: string
          enum: [DOC, DOCX, PDF]
        description:
          type: string
          maxLength: 240
        handling_note:
          type: string
          maxLength: 240
    ResourceCatalogMetadata:
      type: object
      additionalProperties: false
      required: [total_records]
      properties:
        total_records:
          type: integer
          minimum: 0
    ResourceCatalogEnvelope:
      type: object
      additionalProperties: false
      required: [status, metadata, data]
      properties:
        status: { type: string, enum: [success] }
        metadata:
          $ref: "#/components/schemas/ResourceCatalogMetadata"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResourceCatalogItem"
    DispatchEventIngressInput:
      type: object
      additionalProperties: false
      required: [eventId]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
    DispatchEventPrefill:
      type: object
      additionalProperties: false
      properties:
        eventIngressAt:
          type: string
          format: date-time
        incidentNumber:
          type: string
          maxLength: 120
        location:
          type: string
          maxLength: 200
        dispatchedCode:
          type: string
          maxLength: 8
          pattern: "^\\d{1,3}[A-Z]?$"
    DispatchEventIngressMetadata:
      type: object
      additionalProperties: false
      required: [total_records]
      properties:
        total_records:
          type: integer
          minimum: 0
          maximum: 1
    DispatchEventIngressEnvelope:
      type: object
      additionalProperties: false
      required: [status, metadata, data]
      properties:
        status: { type: string, enum: [success] }
        metadata:
          $ref: "#/components/schemas/DispatchEventIngressMetadata"
        data:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/DispatchEventPrefill"
    ApiError:
      type: object
      required: [status, error_code, message]
      properties:
        status: { type: string, enum: [error] }
        error_code: { type: string }
        message: { type: string }
